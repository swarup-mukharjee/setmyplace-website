version: '3.8'

services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: setmyplace
      POSTGRES_PASSWORD: setmyplace
      POSTGRES_DB: setmyplace
    ports:
      - "5432:5432"
    volumes:
      - setmyplace_pgdata:/var/lib/postgresql/data

  # 2. Go API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgres://setmyplace:setmyplace@postgres:5432/setmyplace?sslmode=disable
    expose:
      - "8080" # Exposed internally to Nginx
    depends_on:
      - postgres

  # 3. Nginx Web Server & Reverse Proxy
  web:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  setmyplace_pgdata: