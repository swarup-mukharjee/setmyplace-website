# 1. Redirect HTTP traffic for .in to HTTPS .com
server {
    listen 80;
    server_name setmyplace.in www.setmyplace.in;
    return 301 https://www.setmyplace.com$request_uri;
}

# 2. Redirect HTTP traffic for .com to HTTPS .com
server {
    listen 80;
    server_name setmyplace.com www.setmyplace.com;
    return 301 https://$host$request_uri;
}

# 3. Main HTTPS server block for setmyplace.com
server {
    listen 443 ssl;
    server_name setmyplace.com www.setmyplace.com;

    ssl_certificate /etc/letsencrypt/live/setmyplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/setmyplace.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Serve static HTML pages from frontend folder
    location / {
        root /usr/share/nginx/html/frontend;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Serve static assets (CSS, JS, Images) from assets folder
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Forward API requests to Go backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 4. HTTPS server block to catch direct HTTPS requests on .in and redirect them to .com
server {
    listen 443 ssl;
    server_name setmyplace.in www.setmyplace.in;

    ssl_certificate /etc/letsencrypt/live/setmyplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/setmyplace.com/privkey.pem;

    return 301 https://www.setmyplace.com$request_uri;
}
