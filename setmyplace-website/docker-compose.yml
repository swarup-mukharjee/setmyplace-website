
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: setmyplace
      POSTGRES_PASSWORD: setmyplace
      POSTGRES_DB: setmyplace
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    environment:
      - PORT=8080
      - ADMIN_KEY=${ADMIN_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SITE_DIR=../frontend
      - ASSETS_DIR=../assets
    depends_on:
      - db

  web:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html/frontend
      - ./assets:/usr/share/nginx/html/assets
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data:

